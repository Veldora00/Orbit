<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaks — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,440;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#0D1219; --ink-raised:#161D27; --ink-raised-2:#1D2531;
    --line: rgba(243,241,234,0.11); --line-strong: rgba(243,241,234,0.22);
    --paper:#F3F1EA; --paper-dim: rgba(243,241,234,0.64); --paper-faint: rgba(243,241,234,0.4);
    --amber:#D98E3F; --amber-soft:#E9B67C; --teal:#4A9A8C; --red:#C15B4A;
    --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); color:var(--paper); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; }
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  nav{ position:sticky; top:0; z-index:50; background:rgba(13,18,25,0.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
  nav .row{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .brand{ font-family:var(--serif); font-size:21px; font-weight:560; text-decoration:none; color:var(--paper); }
  .brand span{color:var(--amber);}
  .tag{ font-size:12.5px; color:var(--paper-faint); border:1px solid var(--line-strong); padding:4px 10px; margin-left:10px; }
  .navrow{display:flex; align-items:center;}
  .btn-ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--paper-dim); padding:9px 16px; font-size:13.5px; cursor:pointer; }
  .btn-ghost:hover{ color:var(--paper); border-color:var(--paper-dim); }

  main{ padding:48px 0 100px; }
  h1.page-title{ font-family:var(--serif); font-weight:440; font-size:30px; margin:0 0 8px; letter-spacing:-0.01em; }
  .page-sub{ color:var(--paper-dim); font-size:14.5px; margin:0 0 40px; }

  /* ---- login ---- */
  .login-box{ max-width:380px; margin:80px auto; border:1px solid var(--line); padding:40px; background:var(--ink-raised); }
  .login-box h1{ font-family:var(--serif); font-weight:440; font-size:24px; margin:0 0 28px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; color:var(--paper-dim); margin-bottom:7px; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--ink); border:1px solid var(--line-strong); color:var(--paper);
    padding:11px 12px; font-size:14px; font-family:inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--amber); }
  .field textarea{ resize:vertical; min-height:64px; }
  .btn-primary{ background:var(--amber); color:var(--ink); border:none; padding:13px 22px; font-weight:600; font-size:14.5px; cursor:pointer; width:100%; }
  .btn-primary:hover{ background:var(--amber-soft); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .error-msg{ color:var(--red); font-size:13.5px; margin-top:14px; }
  .hidden{ display:none !important; }

  /* ---- device list ---- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .device-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); }
  .device-row{ background:var(--ink-raised); padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .device-row .dinfo{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .device-row .dname{ font-weight:600; font-size:15px; }
  .device-row .did{ font-size:12.5px; color:var(--paper-faint); font-family:monospace; }
  .badge{ font-size:11.5px; padding:3px 9px; letter-spacing:0.02em; }
  .badge.live{ background:rgba(74,154,140,0.18); color:var(--teal); }
  .badge.draft{ background:rgba(217,142,63,0.18); color:var(--amber-soft); }
  .row-actions{ display:flex; gap:8px; }
  .btn-sm{ background:transparent; border:1px solid var(--line-strong); color:var(--paper-dim); padding:7px 14px; font-size:13px; cursor:pointer; }
  .btn-sm:hover{ color:var(--paper); border-color:var(--paper-dim); }
  .btn-sm.danger:hover{ color:var(--red); border-color:var(--red); }

  /* ---- form ---- */
  .form-box{ border:1px solid var(--line); background:var(--ink-raised); padding:32px; margin-top:32px; }
  .form-box h2{ font-family:var(--serif); font-weight:440; font-size:21px; margin:0 0 24px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }
  fieldset{ border:1px solid var(--line-strong); padding:16px; margin:0 0 22px; }
  legend{ font-size:12.5px; color:var(--paper-dim); padding:0 8px; }
  .dyn-row{ display:flex; gap:10px; margin-bottom:10px; align-items:center; }
  .dyn-row input{ flex:1; }
  .dyn-remove{ background:transparent; border:1px solid var(--line-strong); color:var(--paper-faint); width:34px; height:38px; cursor:pointer; flex-shrink:0; }
  .dyn-remove:hover{ color:var(--red); border-color:var(--red); }
  .btn-add{ background:transparent; border:1px dashed var(--line-strong); color:var(--paper-dim); padding:9px 14px; font-size:13px; cursor:pointer; width:100%; }
  .btn-add:hover{ color:var(--paper); border-color:var(--paper-dim); }
  .status-toggle{ display:flex; gap:10px; margin-bottom:4px; }
  .status-opt{ flex:1; border:1px solid var(--line-strong); padding:11px; text-align:center; cursor:pointer; font-size:13.5px; }
  .status-opt.active{ border-color:var(--amber); color:var(--amber); }
  .terms-row{ display:flex; gap:16px; align-items:center; margin-bottom:10px; }
  .terms-row label{ width:70px; font-size:13.5px; color:var(--paper-dim); }
  .terms-row input[type=checkbox]{ accent-color:var(--amber); }
  .terms-row input[type=number]{ width:110px; }
  .form-actions{ display:flex; gap:12px; margin-top:8px; }
  .form-actions .btn-primary{ width:auto; flex:1; }
  .form-actions .btn-ghost{ flex:0 0 auto; }
  .save-msg{ font-size:13.5px; margin-top:14px; }
  .save-msg.ok{ color:var(--teal); }
  .save-msg.err{ color:var(--red); }
  .empty-note{ color:var(--paper-faint); font-size:14px; padding:40px 0; text-align:center; }
</style>
</head>
<body>

<nav>
  <div class="wrap row">
    <a href="index.html" class="brand navrow">Tal<span>a</span>ks<span class="tag">Admin</span></a>
    <button class="btn-ghost hidden" id="logout-btn">Log out</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-box" id="login-box">
  <h1>Admin sign in</h1>
  <div class="field">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username">
  </div>
  <div class="field">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password">
  </div>
  <button class="btn-primary" id="login-btn">Sign in</button>
  <div class="error-msg hidden" id="login-error"></div>
</div>

<!-- APP -->
<main class="wrap hidden" id="app">
  <h1 class="page-title">Devices</h1>
  <p class="page-sub">Editing this table updates <strong>talaks.com.au</strong> immediately — no redeploy needed. A device with no subscription pricing is saved as a <em>draft</em> and stays hidden from the live site.</p>

  <div class="toolbar">
    <span id="device-count" style="font-size:13.5px; color:var(--paper-dim);"></span>
    <button class="btn-sm" id="add-device-btn" style="border-color:var(--amber); color:var(--amber);">+ Add device</button>
  </div>

  <div class="device-list" id="device-list"></div>

  <div class="form-box hidden" id="form-box"></div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    'https://asajwviusixmnoolawnb.supabase.co',
    'sb_publishable__KTvqClMNFPO2ZHkueUJmA_101Fl1_D'
  );

  const loginBox = document.getElementById('login-box');
  const app = document.getElementById('app');
  const logoutBtn = document.getElementById('logout-btn');
  const loginError = document.getElementById('login-error');
  const deviceList = document.getElementById('device-list');
  const deviceCount = document.getElementById('device-count');
  const formBox = document.getElementById('form-box');

  let DEVICES = [];

  // ---------------- AUTH ----------------
  async function checkSession(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){ showLogin(); return; }
    const { data: isAdmin, error } = await supabaseClient.rpc('is_admin');
    if (error || !isAdmin){
      await supabaseClient.auth.signOut();
      showLogin('Signed in, but this account is not an admin.');
      return;
    }
    showApp();
  }

  function showLogin(msg){
    loginBox.classList.remove('hidden');
    app.classList.add('hidden');
    logoutBtn.classList.add('hidden');
    if (msg){ loginError.textContent = msg; loginError.classList.remove('hidden'); }
  }

  function showApp(){
    loginBox.classList.add('hidden');
    app.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    loadDevices();
  }

  document.getElementById('login-btn').onclick = async () => {
    loginError.classList.add('hidden');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (error){
      loginError.textContent = error.message;
      loginError.classList.remove('hidden');
      return;
    }
    checkSession();
  };

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  logoutBtn.onclick = async () => {
    await supabaseClient.auth.signOut();
    showLogin();
  };

  // ---------------- LOAD / RENDER LIST ----------------
  async function loadDevices(){
    formBox.classList.add('hidden');
    formBox.innerHTML = '';
    const { data, error } = await supabaseClient.from('devices').select('*').order('brand').order('name');
    if (error){
      deviceList.innerHTML = '<div class="empty-note">Could not load devices: ' + error.message + '</div>';
      return;
    }
    DEVICES = data;
    renderList();
  }

  function renderList(){
    deviceCount.textContent = DEVICES.length + ' device' + (DEVICES.length === 1 ? '' : 's');
    if (DEVICES.length === 0){
      deviceList.innerHTML = '<div class="empty-note">No devices yet.</div>';
      return;
    }
    deviceList.innerHTML = '';
    DEVICES.forEach(d => {
      const isLive = !!d.terms;
      const row = document.createElement('div');
      row.className = 'device-row';
      row.innerHTML =
        '<div class="dinfo">' +
          '<span class="dname">' + escapeHtml(d.name) + '</span>' +
          '<span class="did">' + escapeHtml(d.id) + '</span>' +
          '<span class="badge ' + (isLive ? 'live' : 'draft') + '">' + (isLive ? 'Live' : 'Draft') + '</span>' +
        '</div>' +
        '<div class="row-actions">' +
          '<button class="btn-sm" data-edit="' + escapeHtml(d.id) + '">Edit</button>' +
          '<button class="btn-sm danger" data-delete="' + escapeHtml(d.id) + '">Delete</button>' +
        '</div>';
      deviceList.appendChild(row);
    });
    deviceList.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(b.dataset.edit));
    deviceList.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteDevice(b.dataset.delete));
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function deleteDevice(id){
    const device = DEVICES.find(d => d.id === id);
    if (!confirm('Delete "' + (device ? device.name : id) + '"? This removes it permanently from the database and the live site.')) return;
    const { error } = await supabaseClient.from('devices').delete().eq('id', id);
    if (error){ alert('Delete failed: ' + error.message); return; }
    loadDevices();
  }

  document.getElementById('add-device-btn').onclick = () => openForm(null);

  // ---------------- FORM ----------------
  let formState = null; // { isNew, id, brand, name, sub, care_monthly, cover_desc, status, terms:{12,24,36}, storages:[], colours:[] }

  function openForm(id){
    const existing = id ? DEVICES.find(d => d.id === id) : null;
    if (existing){
      formState = {
        isNew: false,
        id: existing.id,
        brand: existing.brand || '',
        name: existing.name || '',
        sub: existing.sub || '',
        care_monthly: existing.care_monthly ?? '',
        cover_desc: existing.cover_desc || '',
        status: existing.terms ? 'live' : 'draft',
        terms: { 12: existing.terms?.[12] != null ? existing.terms[12]*100 : '', 24: existing.terms?.[24] != null ? existing.terms[24]*100 : '', 36: existing.terms?.[36] != null ? existing.terms[36]*100 : '' },
        storages: existing.storages && existing.storages.length ? JSON.parse(JSON.stringify(existing.storages)) : [{ gb:'', rrp:'' }],
        colours: existing.colours && existing.colours.length ? JSON.parse(JSON.stringify(existing.colours)) : [{ name:'', img:'' }],
      };
    } else {
      formState = {
        isNew: true, id: '', brand: 'Apple', name: '', sub: '', care_monthly: '', cover_desc: '',
        status: 'draft', terms: { 12:'', 24:'', 36:'' },
        storages: [{ gb:'', rrp:'' }], colours: [{ name:'', img:'' }],
      };
    }
    renderForm();
  }

  function renderForm(){
    const f = formState;
    formBox.classList.remove('hidden');
    formBox.innerHTML =
      '<h2>' + (f.isNew ? 'Add device' : 'Edit — ' + escapeHtml(f.name || f.id)) + '</h2>' +
      '<div class="grid2">' +
        '<div class="field"><label>Device ID (slug, e.g. galaxy-s27)</label><input id="f-id" value="' + escapeHtml(f.id) + '" ' + (f.isNew ? '' : 'disabled') + '></div>' +
        '<div class="field"><label>Brand</label><select id="f-brand">' +
          '<option ' + (f.brand==='Apple'?'selected':'') + '>Apple</option>' +
          '<option ' + (f.brand==='Samsung'?'selected':'') + '>Samsung</option>' +
          (f.brand && f.brand!=='Apple' && f.brand!=='Samsung' ? '<option selected value="' + escapeHtml(f.brand) + '">' + escapeHtml(f.brand) + '</option>' : '') +
        '</select></div>' +
      '</div>' +
      '<div class="field"><label>Name (shown to customers)</label><input id="f-name" value="' + escapeHtml(f.name) + '"></div>' +
      '<div class="field"><label>Description</label><textarea id="f-sub">' + escapeHtml(f.sub) + '</textarea></div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Damage Cover — monthly ($)</label><input type="number" step="0.01" id="f-care" value="' + escapeHtml(f.care_monthly) + '"></div>' +
        '<div class="field"><label>Damage Cover — description</label><input id="f-coverdesc" value="' + escapeHtml(f.cover_desc) + '"></div>' +
      '</div>' +

      '<fieldset><legend>Status</legend>' +
        '<div class="status-toggle">' +
          '<div class="status-opt ' + (f.status==='draft'?'active':'') + '" data-status="draft">Draft (hidden from site)</div>' +
          '<div class="status-opt ' + (f.status==='live'?'active':'') + '" data-status="live">Live</div>' +
        '</div>' +
      '</fieldset>' +

      '<fieldset><legend>Subscription pricing — % of RRP by term</legend>' +
        [12,24,36].map(m =>
          '<div class="terms-row">' +
            '<label>' + m + ' mo</label>' +
            '<input type="checkbox" data-term-check="' + m + '" ' + (f.terms[m] !== '' ? 'checked' : '') + '>' +
            '<input type="number" step="0.1" placeholder="e.g. 49.7" data-term-val="' + m + '" value="' + escapeHtml(f.terms[m]) + '" ' + (f.terms[m] === '' ? 'disabled' : '') + '>' +
            '<span style="font-size:12.5px; color:var(--paper-faint);">%</span>' +
          '</div>'
        ).join('') +
      '</fieldset>' +

      '<fieldset><legend>Storage tiers</legend><div id="storage-rows"></div>' +
        '<button type="button" class="btn-add" id="add-storage">+ Add storage tier</button></fieldset>' +

      '<fieldset><legend>Colours</legend><div id="colour-rows"></div>' +
        '<button type="button" class="btn-add" id="add-colour">+ Add colour</button></fieldset>' +

      '<div class="form-actions">' +
        '<button class="btn-primary" id="save-btn">Save device</button>' +
        '<button class="btn-ghost" id="cancel-btn">Cancel</button>' +
      '</div>' +
      '<div class="save-msg hidden" id="save-msg"></div>';

    renderStorageRows();
    renderColourRows();

    formBox.querySelectorAll('[data-status]').forEach(el => el.onclick = () => {
      syncFieldsIntoState();
      formState.status = el.dataset.status;
      renderForm();
    });
    formBox.querySelectorAll('[data-term-check]').forEach(cb => cb.onchange = () => {
      const m = cb.dataset.termCheck;
      formState.terms[m] = cb.checked ? (formState.terms[m] === '' ? '' : formState.terms[m]) : '';
      const valInput = formBox.querySelector('[data-term-val="' + m + '"]');
      valInput.disabled = !cb.checked;
      if (!cb.checked) valInput.value = '';
    });
    formBox.querySelectorAll('[data-term-val]').forEach(inp => inp.oninput = () => {
      formState.terms[inp.dataset.termVal] = inp.value;
    });

    document.getElementById('add-storage').onclick = () => { formState.storages.push({ gb:'', rrp:'' }); renderStorageRows(); };
    document.getElementById('add-colour').onclick = () => { formState.colours.push({ name:'', img:'' }); renderColourRows(); };
    document.getElementById('cancel-btn').onclick = () => { formBox.classList.add('hidden'); formBox.innerHTML=''; };
    document.getElementById('save-btn').onclick = saveDevice;
  }

  function syncFieldsIntoState(){
    if (!formState) return;
    const idEl = document.getElementById('f-id');
    if (idEl && !idEl.disabled) formState.id = idEl.value;
    const nameEl = document.getElementById('f-name');
    if (nameEl) formState.name = nameEl.value;
    const brandEl = document.getElementById('f-brand');
    if (brandEl) formState.brand = brandEl.value;
    const subEl = document.getElementById('f-sub');
    if (subEl) formState.sub = subEl.value;
    const careEl = document.getElementById('f-care');
    if (careEl) formState.care_monthly = careEl.value;
    const coverEl = document.getElementById('f-coverdesc');
    if (coverEl) formState.cover_desc = coverEl.value;
  }

  function renderStorageRows(){
    const wrap = document.getElementById('storage-rows');
    wrap.innerHTML = '';
    formState.storages.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'dyn-row';
      row.innerHTML =
        '<input placeholder="e.g. 256GB" value="' + escapeHtml(s.gb) + '" data-s-gb="' + i + '">' +
        '<input type="number" placeholder="RRP $" value="' + escapeHtml(s.rrp) + '" data-s-rrp="' + i + '">' +
        '<button type="button" class="dyn-remove" data-s-remove="' + i + '">×</button>';
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('[data-s-gb]').forEach(inp => inp.oninput = () => formState.storages[inp.dataset.sGb].gb = inp.value);
    wrap.querySelectorAll('[data-s-rrp]').forEach(inp => inp.oninput = () => formState.storages[inp.dataset.sRrp].rrp = inp.value);
    wrap.querySelectorAll('[data-s-remove]').forEach(btn => btn.onclick = () => { formState.storages.splice(btn.dataset.sRemove,1); renderStorageRows(); });
  }

  function renderColourRows(){
    const wrap = document.getElementById('colour-rows');
    wrap.innerHTML = '';
    formState.colours.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'dyn-row';
      row.innerHTML =
        '<input placeholder="Colour name" value="' + escapeHtml(c.name) + '" data-c-name="' + i + '">' +
        '<input placeholder="images/example.jpg" value="' + escapeHtml(c.img) + '" data-c-img="' + i + '">' +
        '<button type="button" class="dyn-remove" data-c-remove="' + i + '">×</button>';
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('[data-c-name]').forEach(inp => inp.oninput = () => formState.colours[inp.dataset.cName].name = inp.value);
    wrap.querySelectorAll('[data-c-img]').forEach(inp => inp.oninput = () => formState.colours[inp.dataset.cImg].img = inp.value);
    wrap.querySelectorAll('[data-c-remove]').forEach(btn => btn.onclick = () => { formState.colours.splice(btn.dataset.cRemove,1); renderColourRows(); });
  }

  function slugify(s){
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  async function saveDevice(){
    const msg = document.getElementById('save-msg');
    msg.className = 'save-msg'; msg.classList.add('hidden');

    const f = formState;
    let id = document.getElementById('f-id').value.trim();
    const name = document.getElementById('f-name').value.trim();
    const brand = document.getElementById('f-brand').value.trim();
    const sub = document.getElementById('f-sub').value.trim();
    const care_monthly = document.getElementById('f-care').value === '' ? null : Number(document.getElementById('f-care').value);
    const cover_desc = document.getElementById('f-coverdesc').value.trim();

    if (f.isNew && !id) id = slugify(name);
    if (!id || !name || !brand){
      msg.textContent = 'Device ID, name, and brand are required.';
      msg.classList.add('err'); msg.classList.remove('hidden');
      return;
    }

    const storages = f.storages
      .filter(s => s.gb !== '' && s.rrp !== '')
      .map(s => ({ gb: s.gb, rrp: Number(s.rrp) }));
    const colours = f.colours
      .filter(c => c.name !== '' && c.img !== '')
      .map(c => ({ name: c.name, img: c.img }));

    if (storages.length === 0 || colours.length === 0){
      msg.textContent = 'At least one storage tier and one colour are required.';
      msg.classList.add('err'); msg.classList.remove('hidden');
      return;
    }

    let terms = null;
    if (f.status === 'live'){
      terms = {};
      [12,24,36].forEach(m => {
        if (f.terms[m] !== '' && f.terms[m] != null) terms[m] = Number(f.terms[m]) / 100;
      });
      if (Object.keys(terms).length === 0){
        msg.textContent = 'A live device needs at least one subscription term priced.';
        msg.classList.add('err'); msg.classList.remove('hidden');
        return;
      }
    }

    const payload = { id, brand, name, sub, care_monthly, cover_desc, terms, storages, colours };

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

    let error;
    if (f.isNew){
      ({ error } = await supabaseClient.from('devices').insert(payload));
    } else {
      ({ error } = await supabaseClient.from('devices').update(payload).eq('id', f.id));
    }

    saveBtn.disabled = false; saveBtn.textContent = 'Save device';

    if (error){
      msg.textContent = 'Save failed: ' + error.message;
      msg.classList.add('err'); msg.classList.remove('hidden');
      return;
    }
    await loadDevices();
  }

  checkSession();
</script>

</body>
</html>
